<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactividad con el DOM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="tarjeta">
    <h1>Interactividad con el DOM</h1>
    <p class="subtitulo">
      Haz clic en el botón para incrementar el contador y registrar la hora exacta del evento en la tabla.
    </p>

    <div id="contador" class="contador">0</div>

    <button id="btn-like" class="btn btn-verde">¡Haz Clic Aquí!</button>

    <div class="botones-extra">
      <button id="btn-restar" class="btn btn-naranja">Restar Like</button>
      <button id="btn-reiniciar" class="btn btn-gris">Reiniciar a cero</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>Nº Clic</th>
          <th>Hora</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla"></tbody>
    </table>
  </main>

  <script src="script.js"></script>
</body>
</html>
